name: Inspect official mobile replay autoplay support
on:
  push:
    branches: [main]
    paths: ['scripts/probe_media_autoplay.py', '.github/workflows/media-autoplay-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python3 -u scripts/probe_media_autoplay.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-player-configuration
          path: /tmp/media-autoplay-report.json
