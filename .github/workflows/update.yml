name: Calendar official schedule validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect and validate public official schedules
        run: python3 -u scripts/calendar_schedule.py --output /tmp/calendar/schedule.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-calendar
          path: /tmp/calendar/schedule.json
