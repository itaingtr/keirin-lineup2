name: Keep hourly cards and quarter-hour odds running
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Worker duration in seconds (maximum21000; normally21000)'
        type: string
        default: '21000'
      renew_after_seconds:
        description: 'Queue successor after this many seconds (normally18000)'
        type: string
        default: '18000'
  schedule:
    # Queue the next runner while the current runner keeps time itself.
    - cron: '7 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: keirin-lineup2-heartbeat
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Start a checked current card update immediately
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u scripts/update_heartbeat.py --once
  keep-time:
    needs: start
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Keep updating and queue the next heartbeat before handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEARTBEAT_DURATION: ${{ inputs.duration_seconds || '21000' }}
          HEARTBEAT_RENEW_AFTER: ${{ inputs.renew_after_seconds || '18000' }}
        run: |
          python3 -u scripts/update_heartbeat.py \
            --duration-seconds "$HEARTBEAT_DURATION" \
            --renew-after-seconds "$HEARTBEAT_RENEW_AFTER"
