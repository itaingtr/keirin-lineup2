name: Collect isolated ten-meeting index2 experiment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ten-preview.yml'
      - 'scripts/ten_meetings.py'
      - 'scripts/ten_preview.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: keirin-lineup2-ten-experiment
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect checked public history for this isolated trial
        run: |
          git fetch origin odds-diagnostics
          python3 -u - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from published_card import read_published
          from ten_preview import prepare
          card,races,target=read_published('FETCH_HEAD')
          prepare(card,races,target,'run-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],Path('site'))
          PY
      - name: Save only the checked experiment and request publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/ten-preview
          git commit -m 'Save checked ten-meeting index2 experiment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from update_heartbeat import dispatch_workflow
          dispatch_workflow('update.yml',{'mode':'publish','date':''})
          PY
