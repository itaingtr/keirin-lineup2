name: Verify daily history in mobile Chrome with the existing read-only client
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/previous-browser.yml'
      - 'tests/test_previous_browser.cjs'
      - 'scripts/previous_daily.py'
      - 'scripts/previous_presentation.py'
      - 'scripts/export_pages.py'
      - 'scripts/compact_presentation.py'
      - 'site/mobile-replay.js'
      - 'tests/test_mobile_replay.cjs'
      - 'site/ten-meetings.js'
      - 'site/ten-meetings.css'
      - 'scripts/official_publication.py'
      - 'scripts/rider_history.py'
      - 'scripts/recent_flags.py'
      - 'site/previous-meetings.js'
      - 'site/previous-meetings.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Wait for the publisher to save the checked daily history
        run: |
          python3 - <<'PY'
          import subprocess,time,sys
          sys.path.insert(0,'scripts')
          from export_pages import page_date
          for attempt in range(30):
              subprocess.run(['git','fetch','origin','main'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              source=subprocess.check_output(['git','show','FETCH_HEAD:site/index.html'],text=True)
              day=page_date(source)
              result=subprocess.run(['git','show','FETCH_HEAD:site/previous-daily/'+day+'/latest.json'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if day>='20261113' and result.returncode==0:
                  result=subprocess.run(['git','show','FETCH_HEAD:site/ten-daily/'+day+'/latest.json'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if result.returncode==0:
                  subprocess.run(['git','checkout','--detach','FETCH_HEAD'],check=True)
                  break
              time.sleep(10)
          else:raise RuntimeError('The checked current-day history has not been saved yet')
          PY
      - name: Export actual daily pages and install the pinned browser client
        run: |
          python3 scripts/export_pages.py
          npm install --prefix /tmp/lineup2-browser --no-audit --no-fund playwright-core@1.62.1
      - name: Install Japanese fonts for visual review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify mobile geometry and an actual read-only condition query
        run: NODE_PATH=/tmp/lineup2-browser/node_modules node tests/test_previous_browser.cjs public /tmp/previous-mobile.png
      - name: Verify shared ten-meeting histories on the formal top page
        run: NODE_PATH=/tmp/lineup2-browser/node_modules node tests/test_ten_browser.cjs public /tmp/formal-ten-mobile.png index.html
      - name: Verify one-touch official replay in the current phone viewport
        run: NODE_PATH=/tmp/lineup2-browser/node_modules node tests/test_mobile_replay.cjs public /tmp/mobile-replay.png
      - name: Save the review screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-history-mobile
          path: |
            /tmp/previous-mobile.png
            /tmp/formal-ten-mobile.png
            /tmp/mobile-replay.png
          if-no-files-found: ignore
