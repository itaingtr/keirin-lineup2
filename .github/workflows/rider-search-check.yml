name: Verify name-based rider history search
on:
  push:
    branches: [main, feat/rider-name-search, feat/rider-directory, feat/rider-counts-history]
    paths:
      - 'site/daily-results/search*'
      - 'scripts/rider_search.py'
      - 'scripts/collect_rider_profile.cjs'
      - 'site/rider-facts/**'
      - 'tests/check_live_rider_profile.cjs'
      - 'supabase/functions/rider-profile/**'
      - 'tests/test_rider_search*'
      - 'tests/test_rider_profile.cjs'
      - 'tests/test_rider_directory.cjs'
      - 'tests/test_rider_counts.cjs'
      - 'tests/fixtures/rider-history-height-before.css'
      - '.github/workflows/rider-search-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Verify catalogue and pure profile parsing
        run: |
          python3 -m unittest discover -s tests -q
          node tests/test_rider_profile.cjs
          node tests/test_rider_directory.cjs
      - name: Install pinned display and browser readers
        run: npm install --prefix /tmp/rider-search-qa --no-audit --no-fund linkedom@0.18.12 playwright-core@1.62.1
      - name: Check the real official profile without writing to the database
        run: |
          NODE_PATH=/tmp/rider-search-qa/node_modules node tests/test_rider_counts.cjs
          NODE_PATH=/tmp/rider-search-qa/node_modules node scripts/collect_rider_profile.cjs 014396 脇本雄太 94
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('site');ref=json.loads((root/'rider-profiles/current.json').read_text())['players']['014396']
          print('CHECKED_RIDER_PROFILE '+(root/ref['path']).read_text().strip())
          PY
          python3 scripts/export_pages.py > /tmp/rider-search-report.json
      - name: Verify mobile name search, density and error recovery
        run: NODE_PATH=/tmp/rider-search-qa/node_modules node tests/test_rider_search_browser.cjs public
      - name: Verify the read-only published profile API
        if: ${{ !cancelled() }}
        run: node tests/check_live_rider_profile.cjs
      - name: Keep only normalized display evidence and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-search-checked-display
          path: |
            site/rider-profiles
            /tmp/rider-search-report.json
            /tmp/rider-search-mobile.png
            /tmp/rider-directory-mobile.png
            /tmp/rider-history-compact-mobile.png
          if-no-files-found: ignore
