name: Update and publish public keirin lineup
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish: saved card / cards: next day / odds: current race day'
        type: choice
        options: [publish, cards, odds, preview, history]
        default: publish
      date:
        description: 'Optional YYYY-MM-DD for manual cards only'
        required: false
        type: string
  # heartbeat.yml dispatches hourly card checks and quarter-hour odds. Its
  # resident runner keeps time even when GitHub cron starts are delayed.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: keirin-lineup2-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate the independent collector and public export
        run: |
          python3 -m unittest discover -s tests -v
          node --check tests/test_pages.cjs
      - name: Prepare the requested update without a database write
        id: update
        env:
          UPDATE_EVENT: ${{ github.event_name }}
          UPDATE_SCHEDULE: ${{ github.event.schedule }}
          UPDATE_MODE: ${{ inputs.mode || 'publish' }}
          UPDATE_DATE: ${{ inputs.date }}
        run: |
          python3 -u scripts/official_publication.py \
            --event "$UPDATE_EVENT" --schedule "$UPDATE_SCHEDULE" \
            --mode "$UPDATE_MODE" --date "$UPDATE_DATE" \
            --run-key "run-${{ github.run_id }}-${{ github.run_attempt }}" \
            --work /tmp/lineup2-publication
      - name: Verify actual public pages, rider links and paired odds
        if: steps.update.outputs.publish == 'true'
        run: |
          npm install --prefix /tmp/lineup2-qa --no-audit --no-fund jsdom@26.1.0
          NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_pages.cjs /tmp/lineup2-publication/report.json
          NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_contest_odds.cjs
          NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_odds_polling.cjs
          DAILY_DATA=$(python3 -c 'import json; r=json.load(open("/tmp/lineup2-publication/report.json")); print((r.get("previous_daily") or {}).get("data_path", ""))')
          if [ -n "$DAILY_DATA" ]; then
            NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_previous_meetings.cjs public/index.html "public/$DAILY_DATA"
          fi
          if [ -f public/index2.html ]; then
            PREVIEW_DATA=$(python3 -c 'import json; r=json.load(open("/tmp/lineup2-publication/report.json")); print(r["previous_preview"]["data_path"])')
            NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_previous_meetings.cjs public/index2.html "public/$PREVIEW_DATA"
          fi
          if [ -f public/ten-meetings.js ]; then
            TEN_DATA=$(python3 -c 'import json; r=json.load(open("/tmp/lineup2-publication/report.json")); print(r["ten_preview"]["ten_data_path"])')
            NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_ten_meetings.cjs public/index2.html "public/$TEN_DATA"
          fi
          TEN_DAILY=$(python3 -c 'import json; r=json.load(open("/tmp/lineup2-publication/report.json")); print((r.get("ten_daily") or {}).get("data_path", ""))')
          if [ -n "$TEN_DAILY" ]; then
            NODE_PATH=/tmp/lineup2-qa/node_modules node tests/test_ten_meetings.cjs public/index.html "public/$TEN_DAILY"
          fi
      - name: Configure GitHub Pages
        if: steps.update.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload public site only
        if: steps.update.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy without a manual approval
        if: steps.update.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous public access and all current assets
        if: steps.update.outputs.publish == 'true'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_pages.py --site public --base "$PAGES_URL"
      - name: Confirm publication only after anonymous HTTP checks
        if: steps.update.outputs.publish == 'true'
        run: python3 scripts/publication_state.py --site public --report /tmp/lineup2-publication/report.json --work /tmp/lineup2-confirmation
      - name: Collect optional history only after the checked card is public
        if: steps.update.outputs.card_history_refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_DATE: ${{ steps.update.outputs.target_date }}
        run: gh workflow run update.yml --ref main -f mode=history -f date="$HISTORY_DATE"
      - name: Refresh missing shared rider histories in the background
        if: steps.update.outputs.history_refresh == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/rider_history_worker.py request
      - name: Complete missing previous-meeting SHB in the background
        if: steps.update.outputs.recent_flags_refresh == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/recent_flags_worker.py request
      - name: Report a failed source check after saved-page recovery
        if: always() && steps.update.outputs.card_check_failed == 'true'
        run: |
          echo 'Source card check failed; the checked saved card was preserved. See the update report.'
          exit 1
