name: Verify period details with actual source fields
on:
  push:
    branches: [feature/period-details-20261104]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 -m unittest discover -s tests -q
          node --check tests/test_pages.cjs
      - name: Read only verified rider profile fields and saved odds
        run: |
          git fetch origin odds-diagnostics
          python3 - <<'PY'
          import json,shutil,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from export_pages import export,page_date
          from published_card import parse_page,git_read
          from rider_details import collect_details
          from update_publication import git
          work=Path('/tmp/period-check');work.mkdir()
          page=Path('site/index.html').read_text();day=page_date(page)
          target=day[:4]+'-'+day[4:6]+'-'+day[6:]
          details=collect_details(parse_page(page),target)
          shutil.copytree('site',work/'site')
          payload=json.dumps(details,ensure_ascii=False,separators=(',',':'))
          (work/'details.json').write_text(payload)
          (work/'site'/('line'+day+'.html')/'rider-details.json').write_text(payload)
          report=export(work/'site',work/'public')
          raw=git_read(git('rev-parse','FETCH_HEAD'),'fallback/kdreams/exacta/'+day+'/latest.json')
          (work/'odds.json').write_bytes(raw)
          report.update({'public_dir':str(work/'public'),'local_odds_file':str(work/'odds.json')})
          (work/'report.json').write_text(json.dumps(report))
          print('DETAIL PROFILE READY',json.dumps(report))
          PY
      - name: Verify all actual rider disclosures and existing page behavior
        run: |
          npm install --prefix /tmp/period-qa --no-audit --no-fund jsdom@26.1.0
          NODE_PATH=/tmp/period-qa/node_modules node tests/test_pages.cjs /tmp/period-check/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-period-fields
          path: |
            /tmp/period-check/details.json
            /tmp/period-check/report.json
            /tmp/period-check/odds.json
